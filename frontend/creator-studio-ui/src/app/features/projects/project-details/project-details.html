<button
  class="back-btn"
  (click)="goBack()">
  ← Back to Projects
</button>


<div *ngIf="project">

  <div class="project-details-card">

    <h1>{{ project.name }}</h1>

    <p class="description">
      {{ project.description }}
    </p>

    <div class="status-section">

      <strong>Status:</strong>

      <span class="status">
        {{ project.status }}
      </span>

    </div>


    <!-- AI VIDEO WORKSPACE -->

    <button
      class="ai-video-btn"
      (click)="openAiVideoWorkspace()">
      🎬 Open AI Video Workspace
    </button>

  </div>

  <button
  class="render-btn"
  (click)="openRenderQueue()">

  🎥 Render Final Video

</button>

<button
  class="youtube-btn"
  (click)="openYouTubeOptimizer()">

  ▶️ YouTube Optimizer

</button>

  <!-- PROJECT TASKS -->

  <div class="tasks-header">

    <h2>Project Tasks</h2>

    <button
      class="add-task-btn"
      (click)="addProjectTask()">
      Add Task
    </button>

  </div>

  <p>
    Total Tasks: {{ projectTasks.length }}
  </p>


  <div
    class="task-card"
    *ngFor="let task of projectTasks; let i = index">

    <h3>{{ task.name }}</h3>

    <p>
      Status:
      {{ task.completed ? 'Completed' : 'Pending' }}
    </p>

    <button
      class="complete-btn"
      (click)="toggleProjectTask(i)">
      {{ task.completed ? 'Mark Pending' : 'Mark Complete' }}
    </button>

    <button
      class="delete-btn"
      (click)="deleteProjectTask(i)">
      Delete
    </button>

  </div>


  <p *ngIf="projectTasks.length === 0">
    No tasks added to this project yet.
  </p>

</div>


<!-- PROJECT NOT FOUND -->

<div *ngIf="!project">

  <h2>Project not found</h2>

  <button
    class="back-btn"
    (click)="goBack()">
    ← Back to Projects
  </button>

</div>
