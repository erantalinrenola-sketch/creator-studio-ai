<div *ngIf="project">

  <button
    class="back-btn"
    (click)="goBack()">
    ← Back to Projects
  </button>

  <div class="project-details-card">

    <h1>{{ project.name }}</h1>

    <p class="description">
      {{ project.description }}
    </p>

    <div class="status-section">

      <strong>Status:</strong>

      <span class="status">
        {{ project.status }}
      </span>

    </div>

  </div>


  <!-- PROJECT TASKS -->

  <div class="project-tasks-section">

    <div class="tasks-header">

      <h2>Project Tasks</h2>

      <button
        class="add-task-btn"
        (click)="addProjectTask()">
        Add Task
      </button>

    </div>

    <p>
      Total Tasks: {{ projectTasks.length }}
    </p>


    <div
      class="task-card"
      *ngFor="let task of projectTasks; let i = index">

      <h3>{{ task.name }}</h3>

      <p>
        Status:
        {{ task.completed ? 'Completed' : 'Pending' }}
      </p>

      <button
        class="complete-btn"
        (click)="toggleProjectTask(i)">
        {{ task.completed ? 'Mark Pending' : 'Mark Complete' }}
      </button>

      <button
        class="delete-btn"
        (click)="deleteProjectTask(i)">
        Delete
      </button>

    </div>


    <p *ngIf="projectTasks.length === 0">
      No tasks added to this project yet.
    </p>

  </div>

</div>


<div *ngIf="!project">

  <h2>Project not found</h2>

  <button
    class="back-btn"
    (click)="goBack()">
    ← Back to Projects
  </button>

</div>
