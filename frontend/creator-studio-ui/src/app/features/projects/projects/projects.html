<button (click)="openCreateProjectDialog()">
    Create Project
  </button>
  
  @for(project of projects; track project.name){
  
  <div class="project-card">
  
      <h2>{{ project.name }}</h2>
  
      <p>{{ project.description }}</p>
  
      <span class="status">
          {{ project.status }}
      </span>
  
  </div>
  
  }
