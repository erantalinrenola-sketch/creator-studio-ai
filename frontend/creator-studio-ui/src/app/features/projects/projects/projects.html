<div class="projects-header">

  <h1>Projects</h1>

  <button (click)="openCreateProjectDialog()">
    Create Project
  </button>

</div>

<p>Total Projects: {{ projects.length }}</p>

<div class="projects-grid">

  <div
    class="project-card"
    *ngFor="let project of projects; let i = index">

    <h2>{{ project.name }}</h2>

    <p>{{ project.description }}</p>

    <span class="status">
      {{ project.status }}
    </span>

    <br><br>

    <div class="actions">

      <button
        class="edit-btn"
        (click)="editProject(i)">
        Edit
      </button>

      <button
        class="delete-btn"
        (click)="deleteProject(i)">
        Delete
      </button>

    </div>

  </div>

</div>
