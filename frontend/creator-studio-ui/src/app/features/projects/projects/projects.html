<div class="projects-header">
    <h1>Projects</h1>

    <button>Create Project</button>
</div>

<div class="project-grid">

    @for(project of projects; track project.name){

    <div class="project-card">

        <h2>{{ project.name }}</h2>

        <p>{{ project.description }}</p>

        <span class="status">
            {{ project.status }}
        </span>

    </div>

    }

</div>
