<h1>Prompt Generator</h1>

<p class="subtitle">
  Generate character and scene prompts from scenes.
</p>

<button
  class="generate-btn"
  (click)="generatePrompts()">

  Generate Prompts

</button>

<div
  *ngFor="let scene of scenes; let i = index"
  class="prompt-section">

  <h2>Scene {{ i + 1 }}</h2>

  <div class="prompt-box">

    <h3>Character Prompt</h3>

    <pre>
{{ characterPrompts[i] }}
    </pre>

    <h3>Scene Prompt</h3>

    <pre>
{{ scenePrompts[i] }}
    </pre>

  </div>

</div>
