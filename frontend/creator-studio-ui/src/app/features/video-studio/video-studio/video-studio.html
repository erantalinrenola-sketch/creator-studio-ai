<h1>Video Studio</h1>

<p class="subtitle">
  Create the final AI video from generated assets.
</p>


<!-- PROJECT SUMMARY -->

<div class="summary-section">

  <h2>Project Summary</h2>

  <p>
    <strong>Total Scenes:</strong>
    {{ totalScenes }}
  </p>

  <p>
    <strong>Images Generated:</strong>
    {{ totalImages }}
  </p>

  <p>
    <strong>Voice Generated:</strong>
    {{ totalAudio > 0 ? 'Yes' : 'No' }}
  </p>

  <p>
    <strong>Lip Sync Clips:</strong>
    {{ totalVideos }}
  </p>

  <button
    class="generate-btn"
    (click)="generateFinalVideo()">
    Generate Final Video
  </button>

</div>


<!-- FINAL VIDEO -->

<div
  class="video-section"
  *ngIf="finalVideoGenerated">

  <h2>Final Video Preview</h2>

  <video
    controls
    width="100%">

    <source
      src="https://www.w3schools.com/html/mov_bbb.mp4"
      type="video/mp4">

  </video>

  <br><br>

  <button class="download-btn">
    Download Video
  </button>

</div>
