<h1>Video Studio</h1>

<p class="subtitle">
  Create the final video from your generated scenes, images, voice, and lip-sync.
</p>

<div class="video-stats">

  <div class="stat-card">
    <h3>Scenes</h3>
    <p>{{ totalScenes }}</p>
  </div>

  <div class="stat-card">
    <h3>Images</h3>
    <p>{{ totalImages }}</p>
  </div>

  <div class="stat-card">
    <h3>Audio</h3>
    <p>{{ totalAudio }}</p>
  </div>

  <div class="stat-card">
    <h3>Lip Sync Videos</h3>
    <p>{{ totalVideos }}</p>
  </div>

</div>

<div class="video-section">

  <button
    class="generate-btn"
    (click)="generateFinalVideo()">
    Generate Final Video
  </button>

</div>


<div
  class="success-message"
  *ngIf="finalVideoGenerated">

  <h2>Final Video Generated Successfully!</h2>

  <p>
    Your final video is ready.
  </p>

  <video
    controls
    width="600">

    <source
      src="https://www.w3schools.com/html/mov_bbb.mp4"
      type="video/mp4">

    Your browser does not support the video tag.

  </video>

</div>
