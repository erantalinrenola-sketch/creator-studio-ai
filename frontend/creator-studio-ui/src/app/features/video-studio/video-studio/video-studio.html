<h1>Video Studio</h1>

<p class="subtitle">
  Generate videos from your images.
</p>

<button
  class="generate-btn"
  (click)="generateVideos()">

  Generate Videos

</button>

<hr>

<div *ngIf="generatedImages.length === 0">

  <p>
    No images found.
  </p>

  <p>
    Please generate images first.
  </p>

</div>

<div
  *ngFor="let video of generatedVideos; let i = index"
  class="video-card">

  <h2>Scene {{ i + 1 }}</h2>

  <h3>Prompt</h3>

  <pre>
{{ video.prompt }}
  </pre>

  <video
    controls
    width="600">

    <source
      [src]="video.video"
      type="video/mp4">

    Your browser does not support the video tag.

  </video>

</div>
