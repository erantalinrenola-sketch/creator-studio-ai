<h1>Story Generator</h1>

<p class="subtitle">
  Convert a simple story into a video script.
</p>

<div class="story-section">

  <h2>Enter Story</h2>

  <textarea
    [(ngModel)]="story"
    rows="8"
    placeholder="Write your story here...">
  </textarea>

  <button
    class="generate-btn"
    (click)="generateScript()"
    [disabled]="isGenerating">

    {{ isGenerating ? 'Generating Script...' : 'Generate Script' }}

  </button>

  <p *ngIf="isGenerating">
    AI is generating your script. Please wait...
  </p>

  <hr>

  <p><b>Story Length:</b> {{ story.length }}</p>
  <p><b>Script Length:</b> {{ script.length }}</p>

</div>

<h2>Generated Script</h2>

<textarea
  rows="25"
  style="width:100%; margin-top:20px;">
{{ script }}
</textarea>
