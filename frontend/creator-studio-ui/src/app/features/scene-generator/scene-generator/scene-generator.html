<h1>Scene Generator</h1>

<p class="subtitle">
  Generate scenes from your script.
</p>

<div class="script-section">

  <h2>Generated Script</h2>

  <textarea
    [(ngModel)]="script"
    rows="12"
    readonly>
  </textarea>

  <button
    class="generate-btn"
    (click)="generateScenes()">

    Generate Scenes

  </button>

</div>

<div
  class="scenes-section"
  *ngIf="scenes.length > 0">

  <h2>Generated Scenes</h2>

  <div
    class="scene-card"
    *ngFor="let scene of scenes">

    <h3>
      Scene {{ scene.sceneNumber }}
    </h3>

    <p>
      <strong>Location:</strong><br>
      {{ scene.location }}
    </p>

    <p>
      <strong>Characters:</strong><br>
      {{ scene.characters }}
    </p>

    <p>
      <strong>Action:</strong><br>
      {{ scene.action }}
    </p>

    <p>
      <strong>Dialogue:</strong><br>
      {{ scene.dialogue }}
    </p>

    <p>
      <strong>Emotion:</strong><br>
      {{ scene.emotion }}
    </p>

  </div>

</div>
