<h1>Image Studio</h1>

<p class="subtitle">
  Generate images from your scenes and prompts.
</p>


<!-- AVAILABLE SCENES -->

<div
  class="scenes-section"
  *ngIf="scenes.length > 0">

  <h2>Available Scenes</h2>

  <div
    class="scene-card"
    *ngFor="let scene of scenes; let i = index">

    <h3>{{ scene }}</h3>

    <button
      class="generate-btn"
      (click)="prompt = scene">
      Use This Scene
    </button>

  </div>

</div>


<!-- IMAGE PROMPT -->

<div class="prompt-section">

  <h2>Image Prompt</h2>

  <textarea
    [(ngModel)]="prompt"
    rows="6"
    placeholder="Enter an image prompt...">
  </textarea>

  <button
    class="generate-btn"
    (click)="generateImage()">
    Generate Image
  </button>

</div>


<!-- GENERATED IMAGE -->

<div
  class="image-section"
  *ngIf="generatedImage">

  <h2>Generated Image</h2>

  <img
    [src]="generatedImage"
    alt="Generated Image"
    class="generated-image">

</div>
