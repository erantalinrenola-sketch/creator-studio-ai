<h1>Image Studio</h1>

<p class="subtitle">
  Generate images from scene prompts.
</p>

<button
  class="generate-btn"
  (click)="generateImages()">

  Generate Images

</button>

<hr>

<div *ngIf="scenePrompts.length === 0">

  <p>No scene prompts found.</p>

  <p>Please generate prompts first.</p>

</div>

<div
  *ngFor="let image of generatedImages; let i = index"
  class="image-card">

  <h2>Scene {{ i + 1 }}</h2>

  <h3>Prompt</h3>

  <pre>{{ image.prompt }}</pre>

  <img
    [src]="image.image"
    alt="Generated Image"
    class="generated-image">

</div>
